services:
  - name: frosted-bites
    type: web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: .
    preDeployCommand: python scripts/init_db.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: frosted-bites-db
          property: connectionString

databases:
  - name: frosted-bites-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: frostedbites
