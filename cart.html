<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frosted Bites | Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="cart">
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>
  <header class="site-header glass-panel reveal">
    <a class="brand" href="index.html">
      <span class="brand-mark">V</span>
      <span><strong>Frosted Bites</strong><small>Your curated selections</small></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="profile.html">Check Status</a>
      <a href="cart.html" class="active">Add to Cart <span class="cart-count" data-cart-count>0</span></a>
    </nav>
    <div class="header-actions">
      <a class="neo-btn secondary profile-link hidden" href="profile.html" data-profile-link>AB</a>
      <a class="neo-btn" href="auth.html" data-auth-button>Sign In</a>
    </div>
  </header>
  <main class="page-shell">
    <section class="section reveal">
      <div class="section-head">
        <span class="eyebrow">Your Cart</span>
        <h1>Confirm your luxury order before payment</h1>
      </div>
      <div class="cart-layout">
        <div class="glass-panel cart-list" data-cart-list></div>
        <aside class="glass-panel summary-card" data-cart-summary></aside>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
